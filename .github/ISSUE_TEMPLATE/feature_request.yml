name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Help us understand the community need behind your idea. Small, focused requests are welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain who experiences the problem and why it matters.
      placeholder: As a community member, I need...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you imagine the feature working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or workarounds?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Problem reporting and discovery
        - Community validation and evidence
        - Profiles and recognition
        - AI Solution Lab for validated problems
        - Solutions and impact tracking
        - Accessibility and design
        - Developer experience and documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This proposal focuses on a user or community need.
          required: true
